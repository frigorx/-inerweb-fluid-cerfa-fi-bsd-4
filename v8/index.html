<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>inerWeb Fluide — Traçabilité F-Gas</title>
  <meta name="description" content="inerWeb Fluide — traçabilité des fluides frigorigènes (F-Gas) : parc machines, bouteilles, mouvements, contrôles d'étanchéité et bilan annuel.">

  <!-- CF-10 : Content-Security-Policy stricte mais compatible avec les usages réels
       vérifiés dans le code (aucun oubli futur d'échappement ne serait alors rattrapé) :
       - style-src 'unsafe-inline' : les vues injectent des styles inline (attributs style="…")
       - img-src data: : signature tactile encodée en PNG base64 (wizard/signature.js)
       - img-src/connect-src/worker-src blob: : téléchargements CSV/ZIP/PDF/pièces jointes
         (URL.createObjectURL dans bilan.js, app.js, visualiseur.js, pieces-jointes.js)
         et worker dédié de PDF.js (lib/pdf.worker.min.mjs)
       - object-src 'none', base-uri 'self', form-action 'self' : durcissement standard -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: blob:;
    font-src 'self';
    connect-src 'self';
    worker-src 'self' blob:;
    object-src 'none';
    base-uri 'self';
    form-action 'self';
  ">

  <!-- Polices : IBM Plex Sans (corps), Space Grotesk (titres), IBM Plex Mono (valeurs)
       Auto-hébergées (CF-9) : @font-face dans css/tokens.css, fichiers dans v8/polices/.
       Plus aucun appel à Google Fonts (hors-ligne complet, aucune IP transmise). -->

  <!-- Feuilles de style de la charte -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/coquille.css">
  <link rel="stylesheet" href="css/composants.css">
</head>
<body>

  <!-- Barre latérale de navigation (contenu généré par js/app.js) -->
  <aside id="sidebar" aria-label="Navigation principale"></aside>

  <!-- Voile sombre derrière le tiroir mobile -->
  <div id="voile-sidebar" hidden></div>

  <!-- Zone principale : en-tête collant + contenu de la vue -->
  <div class="zone-principale">
    <header id="entete">
      <button id="bouton-menu" class="bouton-menu no-print" type="button"
              aria-label="Ouvrir le menu de navigation" aria-expanded="false" aria-controls="sidebar"></button>
      <div class="entete-titres">
        <nav id="fil-ariane" class="fil-ariane" aria-label="Fil d'Ariane">inerWeb Fluide</nav>
        <h1 id="titre-page">Chargement…</h1>
      </div>
      <div class="entete-droite">
        <span id="badge-mode" class="badge-mode" title="Mode de fonctionnement de l'application"></span>
        <span class="avatar" aria-hidden="true">FH</span>
      </div>
    </header>

    <!-- CR-5 : bandeau d'intégrité du registre, rempli par app.js au démarrage -->
    <div id="bandeau-integrite" role="alert" hidden></div>

    <main id="vue" tabindex="-1"></main>
  </div>

  <!-- Zones techniques : notifications éphémères et modales -->
  <div id="zone-toasts" aria-live="polite"></div>
  <div id="zone-modales"></div>

  <noscript>
    <div style="max-width:32rem;margin:4rem auto;padding:2rem;background:#fff;border:1px solid #e2e8f0;
                border-radius:14px;font-family:system-ui,sans-serif;color:#1e293b;text-align:center;">
      <h1 style="font-size:1.25rem;margin:0 0 .75rem;">JavaScript est désactivé</h1>
      <p style="margin:0;color:#475569;">
        inerWeb Fluide a besoin de JavaScript pour fonctionner.
        Merci de l'activer dans les réglages de votre navigateur, puis de recharger la page.
      </p>
    </div>
  </noscript>

  <!-- Lib QR code vendored (davidshimjs/qrcodejs), en <script> CLASSIQUE
       (pas type="module") pour qu'elle s'exécute en contexte global
       (this = window), comme elle est conçue à l'origine — voir l'en-tête
       de js/lib/qrcode-vendor.js. DOIT précéder app.js : elle pose
       window.QRCode, lu ensuite par js/lib/qrcode.js (obtenirQRCode()).
       Autorisé par la CSP (script-src 'self', fichier same-origin). -->
  <script src="js/lib/qrcode-vendor.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
