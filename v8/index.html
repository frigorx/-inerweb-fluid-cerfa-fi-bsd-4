<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>inerWeb Fluide — Traçabilité F-Gas</title>

  <!-- Polices : IBM Plex Sans (corps), Space Grotesk (titres), IBM Plex Mono (valeurs) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">

  <!-- Feuilles de style de la charte -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/coquille.css">
  <link rel="stylesheet" href="css/composants.css">
</head>
<body>

  <!-- Barre latérale de navigation (contenu généré par js/app.js) -->
  <aside id="sidebar" aria-label="Navigation principale"></aside>

  <!-- Voile sombre derrière le tiroir mobile -->
  <div id="voile-sidebar" hidden></div>

  <!-- Zone principale : en-tête collant + contenu de la vue -->
  <div class="zone-principale">
    <header id="entete">
      <button id="bouton-menu" class="bouton-menu no-print" type="button"
              aria-label="Ouvrir le menu de navigation" aria-expanded="false" aria-controls="sidebar"></button>
      <div class="entete-titres">
        <nav id="fil-ariane" class="fil-ariane" aria-label="Fil d'Ariane">inerWeb Fluide</nav>
        <h1 id="titre-page">Chargement…</h1>
      </div>
      <div class="entete-droite">
        <span id="badge-mode" class="badge-mode" title="Mode de fonctionnement de l'application"></span>
        <span class="avatar" aria-hidden="true">FH</span>
      </div>
    </header>

    <!-- CR-5 : bandeau d'intégrité du registre, rempli par app.js au démarrage -->
    <div id="bandeau-integrite" role="alert" hidden></div>

    <main id="vue" tabindex="-1"></main>
  </div>

  <!-- Zones techniques : notifications éphémères et modales -->
  <div id="zone-toasts" aria-live="polite"></div>
  <div id="zone-modales"></div>

  <noscript>
    <div style="max-width:32rem;margin:4rem auto;padding:2rem;background:#fff;border:1px solid #e2e8f0;
                border-radius:14px;font-family:system-ui,sans-serif;color:#1e293b;text-align:center;">
      <h1 style="font-size:1.25rem;margin:0 0 .75rem;">JavaScript est désactivé</h1>
      <p style="margin:0;color:#475569;">
        inerWeb Fluide a besoin de JavaScript pour fonctionner.
        Merci de l'activer dans les réglages de votre navigateur, puis de recharger la page.
      </p>
