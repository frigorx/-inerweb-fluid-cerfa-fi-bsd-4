  <text x="154" y="208.5" text-anchor="middle" font-size="5.5" font-weight="bold" fill="#1b3a63">T6</text>
  <text x="45" y="228" font-size="3" fill="#5a6472">Découper au cutter le long du trait, coller à côté de l'embase — jamais sur l'écrou.</text>
</svg>
