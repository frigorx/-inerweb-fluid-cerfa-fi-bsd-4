<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"
     role="img" aria-labelledby="t d" font-family="Trebuchet MS, Tahoma, Verdana, sans-serif">
  <title id="t">Étiquettes de façade et de repérage, à l'échelle 1:1</title>
  <desc id="d">Planche à imprimer sur papier adhésif : l'étiquette de couvercle 120 par 90
    millimètres avec sa fenêtre d'écran découpée, les positions du sélecteur, la case où
    écrire le nom Bluetooth de l'appareil ; puis douze petites étiquettes T1 à T6 pour les
    embases, en double exemplaire.</desc>
  <rect width="210" height="297" fill="#ffffff"/>
  <text x="12" y="13" font-size="5.2" font-weight="bold" fill="#1b3a63">❄ inerWeb Édu — étiquettes 1:1</text>
  <text x="12" y="18" font-size="3.2" fill="#5a6472">Imprimer à 100 % sur papier adhésif. Vérifier le carré de contrôle avant de coller.</text>
  <line x1="12" y1="20" x2="198" y2="20" stroke="#1b3a63" stroke-width="0.4"/>
  <rect x="12" y="24" width="50" height="50" fill="none" stroke="#dc2626" stroke-width="0.5"/>
  <text x="37" y="47" text-anchor="middle" font-size="4" font-weight="bold" fill="#dc2626">50,0 mm</text>
  <text x="37" y="54" text-anchor="middle" font-size="3" fill="#dc2626">à mesurer au réglet</text>
  <text x="68" y="32" font-size="3.4" fill="#1b3a63">L'étiquette de couvercle se colle APRÈS le perçage et l'ébavurage,</text>
  <text x="68" y="37" font-size="3.4" fill="#1b3a63">sur un boîtier dégraissé à l'alcool isopropylique.</text>
  <text x="68" y="44" font-size="3.4" font-weight="bold" fill="#ff6b35">Le nom Bluetooth s'écrit au marqueur indélébile dans la case prévue.</text>
  <text x="68" y="49" font-size="3.4" fill="#1b3a63">Il s'affiche à l'écran au démarrage : ENR-T6-xxxx. Sans lui, six appareils</text>
  <text x="68" y="54" font-size="3.4" fill="#1b3a63">identiques dans une salle sont impossibles à distinguer.</text>
  <text x="68" y="62" font-size="3.4" fill="#1b3a63">Les petites étiquettes T1 à T6 se collent À CÔTÉ de chaque embase,</text>
  <text x="68" y="67" font-size="3.4" fill="#1b3a63">jamais dessus : l'écrou doit rester manœuvrable.</text>
  <text x="68" y="73" font-size="3" fill="#5a6472">Elles sont en double : la première pose rate souvent.</text>
  <text x="45" y="83.5" font-size="4" font-weight="bold" fill="#1b3a63">ÉTIQUETTE DE COUVERCLE — 120 × 90 mm</text>
  <rect x="45" y="86" width="120" height="90" rx="3" fill="#f5f5f0" stroke="#1b3a63" stroke-width="0.5"/>
  <rect x="45" y="86" width="120" height="14" rx="3" fill="#1b3a63"/>
  <rect x="45" y="96" width="120" height="4" fill="#1b3a63"/>
  <text x="50" y="95.5" font-size="6" font-weight="bold" fill="#ffffff">❄ inerWeb</text>
  <rect x="85" y="89.5" width="13" height="7" rx="1.5" fill="#ff6b35"/>
  <text x="91.5" y="95" text-anchor="middle" font-size="4.4" font-weight="bold" fill="#ffffff">Édu</text>
  <text x="162" y="95" text-anchor="end" font-size="3.2" fill="#ffffff">ENREGISTREUR 6 TEMPÉRATURES</text>
  <rect x="89" y="107" width="32" height="18" fill="none" stroke="#dc2626" stroke-width="0.4" stroke-dasharray="2 1.5"/>
  <text x="105" y="117" text-anchor="middle" font-size="3" fill="#dc2626">à découper</text>
  <text x="105" y="121" text-anchor="middle" font-size="3" fill="#dc2626">(fenêtre écran)</text>
  <text x="51" y="108" font-size="4.4" font-weight="bold" fill="#1b3a63">◄ T1</text>
  <text x="51" y="115" font-size="4.4" font-weight="bold" fill="#1b3a63">◄ T2</text>
  <text x="51" y="122" font-size="4.4" font-weight="bold" fill="#1b3a63">◄ T3</text>
  <text x="159" y="108" text-anchor="end" font-size="4.4" font-weight="bold" fill="#1b3a63">T4 ►</text>
  <text x="159" y="115" text-anchor="end" font-size="4.4" font-weight="bold" fill="#1b3a63">T5 ►</text>
  <text x="159" y="122" text-anchor="end" font-size="4.4" font-weight="bold" fill="#1b3a63">T6 ►</text>
  <text x="51" y="134" font-size="2.8" fill="#5a6472">face gauche</text>
  <text x="159" y="134" text-anchor="end" font-size="2.8" fill="#5a6472">face droite</text>
  <rect x="75" y="131" width="60" height="13" rx="2" fill="#ffffff" stroke="#ff6b35" stroke-width="0.6"/>
  <text x="105" y="136" text-anchor="middle" font-size="2.9" fill="#ff6b35">nom Bluetooth de CET appareil</text>
  <text x="105" y="142.5" text-anchor="middle" font-size="4.6" font-weight="bold" fill="#5a6472">ENR-T6- _ _ _ _</text>
  <text x="105" y="152" text-anchor="middle" font-size="3.4" font-weight="bold" fill="#1b3a63">SÉLECTEUR D'ALIMENTATION</text>
  <text x="72" y="159" text-anchor="middle" font-size="4.4" font-weight="bold" fill="#1b3a63">PILES</text>
  <text x="105" y="159" text-anchor="middle" font-size="4.4" font-weight="bold" fill="#1b3a63">0</text>
  <text x="138" y="159" text-anchor="middle" font-size="4.4" font-weight="bold" fill="#1b3a63">USB</text>
  <circle cx="105" cy="165" r="4" fill="none" stroke="#5a6472" stroke-width="0.3" stroke-dasharray="1.5 1"/>
  <text x="105" y="173" text-anchor="middle" font-size="2.8" fill="#5a6472">percer ici · trou Ø6 du sélecteur</text>
  <text x="50" y="173" font-size="2.6" fill="#5a6472">par F. Henninot</text>
  <text x="160" y="168.5" text-anchor="end" font-size="2.6" fill="#5a6472">−37 à +105 °C · outil pédagogique, non raccordé</text>
  <text x="45" y="182" font-size="4" font-weight="bold" fill="#1b3a63">ÉTIQUETTES D'EMBASE — 22 × 10 mm, en double</text>
  <rect x="45" y="186" width="18" height="10" rx="1.5" fill="#ffffff" stroke="#1b3a63" stroke-width="0.4"/>
  <rect x="45" y="186" width="18" height="3" rx="1.5" fill="#ff6b35"/>
