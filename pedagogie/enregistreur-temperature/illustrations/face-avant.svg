  <rect x="105" y="186" width="18" height="3" rx="1.5" fill="#ff6b35"/>
  <rect x="105" y="187.5" width="18" height="1.5" fill="#ff6b35"/>
  <text x="114" y="194.5" text-anchor="middle" font-size="5.5" font-weight="bold" fill="#1b3a63">T4</text>
  <rect x="125" y="186" width="18" height="10" rx="1.5" fill="#ffffff" stroke="#1b3a63" stroke-width="0.4"/>
  <rect x="125" y="186" width="18" height="3" rx="1.5" fill="#ff6b35"/>
  <rect x="125" y="187.5" width="18" height="1.5" fill="#ff6b35"/>
  <text x="134" y="194.5" text-anchor="middle" font-size="5.5" font-weight="bold" fill="#1b3a63">T5</text>
  <rect x="145" y="186" width="18" height="10" rx="1.5" fill="#ffffff" stroke="#1b3a63" stroke-width="0.4"/>
  <rect x="145" y="186" width="18" height="3" rx="1.5" fill="#ff6b35"/>
  <rect x="145" y="187.5" width="18" height="1.5" fill="#ff6b35"/>
  <text x="154" y="194.5" text-anchor="middle" font-size="5.5" font-weight="bold" fill="#1b3a63">T6</text>
  <rect x="45" y="200" width="18" height="10" rx="1.5" fill="#ffffff" stroke="#1b3a63" stroke-width="0.4"/>
  <rect x="45" y="200" width="18" height="3" rx="1.5" fill="#ff6b35"/>
  <rect x="45" y="201.5" width="18" height="1.5" fill="#ff6b35"/>
