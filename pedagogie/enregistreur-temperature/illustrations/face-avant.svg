  <rect x="65" y="200" width="18" height="10" rx="1.5" fill="#ffffff" stroke="#1b3a63" stroke-width="0.4"/>
  <rect x="65" y="200" width="18" height="3" rx="1.5" fill="#ff6b35"/>
