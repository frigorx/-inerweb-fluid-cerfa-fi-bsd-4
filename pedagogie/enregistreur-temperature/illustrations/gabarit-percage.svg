<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"
     role="img" aria-labelledby="t d" font-family="Trebuchet MS, Tahoma, Verdana, sans-serif">
  <title id="t">Gabarit de perçage à l'échelle 1:1 sur A4</title>
  <desc id="d">Gabarit imprimable en taille réelle. Il porte un carré de contrôle de 50
    millimètres à vérifier au réglet après impression, le tracé du couvercle 120 par 90
    millimètres avec la fenêtre de l'écran et le trou du sélecteur, les deux faces longues
    portant chacune trois embases jack espacées de 30 millimètres, et la petite face portant
    la traversée USB-C.</desc>
  <rect width="210" height="297" fill="#ffffff"/>
  <text x="12" y="13" font-size="5.2" font-weight="bold" fill="#1b3a63">❄ inerWeb Édu — gabarit de perçage 1:1</text>
  <text x="12" y="18" font-size="3.2" fill="#5a6472">Enregistreur de températures 6 voies · boîtier ABS 120 × 90 × 60 mm · par F. Henninot</text>
  <line x1="12" y1="20" x2="198" y2="20" stroke="#1b3a63" stroke-width="0.4"/>
  <rect x="12" y="24" width="50" height="50" fill="none" stroke="#dc2626" stroke-width="0.5"/>
  <line x1="12" y1="49" x2="62" y2="49" stroke="#dc2626" stroke-width="0.25" stroke-dasharray="2 1.5"/>
  <text x="37" y="47" text-anchor="middle" font-size="4" font-weight="bold" fill="#dc2626">50,0 mm</text>
  <text x="37" y="54" text-anchor="middle" font-size="3" fill="#dc2626">à mesurer au réglet</text>
  <text x="68" y="29" font-size="4" font-weight="bold" fill="#dc2626">AVANT DE PERCER QUOI QUE CE SOIT</text>
  <text x="68" y="35" font-size="3.2" font-weight="normal" fill="#1b3a63">1. Imprimer à 100 % — « Taille réelle », jamais « Ajuster à la page ».</text>
  <text x="68" y="40" font-size="3.2" font-weight="normal" fill="#1b3a63">2. Mesurer le carré rouge au réglet : il DOIT faire 50,0 mm de côté.</text>
  <text x="68" y="44.5" font-size="3.2" font-weight="normal" fill="#1b3a63">   Sinon l'imprimante a redimensionné, et tout le gabarit est faux.</text>
  <text x="68" y="49.5" font-size="3.2" font-weight="normal" fill="#1b3a63">3. Mesurer le boîtier réel au pied à coulisse et comparer : les boîtiers</text>
  <text x="68" y="54" font-size="3.2" font-weight="normal" fill="#1b3a63">   ABS ont des congés et des colonnettes qui mangent 4 à 6 mm.</text>
  <text x="68" y="59.5" font-size="3.2" font-weight="bold" fill="#ff6b35">4. Percer en montant en diamètre : 3 mm, puis la cote.</text>
  <text x="68" y="64" font-size="3.2" font-weight="bold" fill="#ff6b35">   Lunettes obligatoires. Pièce bridée, jamais tenue à la main.</text>
  <text x="68" y="70" font-size="2.9" font-weight="normal" fill="#5a6472">Cotes NOMINALES, non vérifiées sur un boîtier réel (POINTS-OUVERTS § B3).</text>
  <text x="68" y="74" font-size="2.9" font-weight="normal" fill="#5a6472">Le premier boîtier percé fait foi : corriger ce gabarit après lui.</text>
  <text x="45" y="79" font-size="4" font-weight="bold" fill="#1b3a63">COUVERCLE — 120 × 90 mm, vu de dessus (côté extérieur)</text>
  <text x="45" y="82.5" font-size="2.9" fill="#5a6472">axe de la fenêtre à 30 mm du bord haut · axe du sélecteur à 72 mm du bord haut</text>
