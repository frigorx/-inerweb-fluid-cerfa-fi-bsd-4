<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img"
     aria-labelledby="t d" font-family="Trebuchet MS, Tahoma, Verdana, sans-serif">
  <title id="t">Schéma général de l'enregistreur six voies</title>
  <desc id="d">Six ponts diviseurs identiques : une résistance de 10 kilohms du rail 3,3 volts
    vers le point milieu, une sonde NTC du point milieu vers la masse, un condensateur de
    100 nanofarads en parallèle sur la sonde. Les points milieux de T1 à T4 rejoignent les
    quatre entrées du convertisseur ADS1115 d'adresse 0x48 ; ceux de T5 et T6 rejoignent les
    deux premières entrées du convertisseur d'adresse 0x49, dont les deux entrées restantes
    mesurent la moitié de la tension d'excitation et la moitié de la tension des piles. Les
    deux convertisseurs et l'écran OLED d'adresse 0x3C partagent le bus I²C de l'ESP32-C3,
    sur les broches GPIO5 pour SDA et GPIO6 pour SCL.</desc>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="600" y="32" text-anchor="middle" font-size="23" font-weight="bold" fill="#1b3a63">
    Schéma général — six voies, huit entrées, trois adresses</text>
  <line x1="50" y1="76" x2="620" y2="76" stroke="#dc2626" stroke-width="4"/>
  <text x="50" y="66" font-size="14" font-weight="bold" fill="#dc2626">RAIL 3,30 V — c'est aussi la tension d'excitation des six ponts</text>
  <line x1="50" y1="600" x2="1170" y2="600" stroke="#2b2b2b" stroke-width="3"/>
  <text x="50" y="624" font-size="14" font-weight="bold" fill="#2b2b2b">MASSE COMMUNE — un seul fil noir fait le tour des six embases</text>
