  <text x="70" y="660" font-size="14" fill="#1b3a63"><tspan font-weight="bold">Six ponts identiques</tspan> — R1 à R6 en 10 kΩ 0,1 %, C3 à C8 en 100 nF (le condensateur n'est dessiné que sur T1, les cinq autres sont pareils).</text>
  <text x="70" y="678" font-size="14" fill="#1b3a63"><tspan font-weight="bold">Trois circuits, trois adresses, deux fils.</tspan> C'est tout le bus I²C. Un demi-cercle sur un fil = il en croise un autre SANS le toucher.</text>
