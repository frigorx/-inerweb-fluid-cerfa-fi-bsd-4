<!-- =========================================================
     FIG 1 — Circuit frigorifique de base (4 composants)
     HP rouge, BP bleu, points 1-2-3-4
     ========================================================= -->
<figure id="fig-circuit">
<svg viewBox="0 0 640 360" role="img" aria-label="Schéma de principe du circuit frigorifique">
  <defs>
    <marker id="fl" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#333"/>
    </marker>
  </defs>
  <!-- lignes fluide : HP (rouge) haut, BP (bleu) bas -->
  <!-- 1 -> 2 : aspiration BP (évap -> compresseur) -->
  <path d="M120,270 H430" fill="none" stroke="#2471a3" stroke-width="5" marker-end="url(#fl)"/>
  <!-- 2 -> 3 : refoulement HP (compresseur -> condenseur) -->
  <path d="M500,240 V90 H430" fill="none" stroke="#c0392b" stroke-width="5" marker-end="url(#fl)"/>
  <!-- 3 -> 4 : ligne liquide HP (condenseur -> détendeur) -->
  <path d="M210,90 H150 V150" fill="none" stroke="#c0392b" stroke-width="5" marker-end="url(#fl)"/>
  <!-- 4 -> 1 : BP (détendeur -> évaporateur) -->
  <path d="M150,205 V270" fill="none" stroke="#2471a3" stroke-width="5"/>

  <!-- Compresseur -->
  <circle cx="500" cy="255" r="34" fill="#fdf3d0" stroke="#333" stroke-width="2.5"/>
  <path d="M478,238 L522,272 M478,272 L522,238" stroke="#333" stroke-width="2"/>
  <text x="500" y="312" text-anchor="middle" font-size="13" font-weight="700">Compresseur</text>

  <!-- Condenseur -->
  <rect x="210" y="62" width="220" height="56" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="2.5"/>
  <path d="M225,90 h20 v-14 h20 v28 h20 v-28 h20 v28 h20 v-28 h20 v14 h20" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="320" y="50" text-anchor="middle" font-size="13" font-weight="700" fill="#c0392b">Condenseur</text>

  <!-- Détendeur (triangle) -->
  <path d="M150,150 l22,28 h-44 Z" fill="#eef2f6" stroke="#333" stroke-width="2.5"/>
  <path d="M150,205 l22,-28 h-44 Z" fill="#eef2f6" stroke="#333" stroke-width="2.5"/>
  <text x="150" y="192" text-anchor="middle" font-size="10" font-weight="700">Détendeur</text>

  <!-- Évaporateur -->
  <rect x="120" y="242" width="220" height="56" rx="5" fill="#eaf3fb" stroke="#2471a3" stroke-width="2.5"/>
  <path d="M135,270 h20 v-14 h20 v28 h20 v-28 h20 v28 h20 v-28 h20 v14 h20" fill="none" stroke="#2471a3" stroke-width="2"/>
  <text x="230" y="330" text-anchor="middle" font-size="13" font-weight="700" fill="#2471a3">Évaporateur</text>

  <!-- Points repères -->
  <g font-size="13" font-weight="800">
    <circle cx="120" cy="270" r="12" fill="#fff" stroke="#2471a3" stroke-width="2"/><text x="120" y="275" text-anchor="middle">1</text>
    <circle cx="500" cy="215" r="12" fill="#fff" stroke="#c0392b" stroke-width="2"/><text x="500" y="220" text-anchor="middle">2</text>
    <circle cx="210" cy="90" r="12" fill="#fff" stroke="#c0392b" stroke-width="2"/><text x="210" y="95" text-anchor="middle">3</text>
    <circle cx="150" cy="222" r="12" fill="#fff" stroke="#2471a3" stroke-width="2"/><text x="150" y="227" text-anchor="middle">4</text>
  </g>
  <!-- Légende HP/BP -->
  <g font-size="11">
    <rect x="470" y="120" width="150" height="46" fill="#fff" stroke="#b8c4cf"/>
    <line x1="480" y1="134" x2="510" y2="134" stroke="#c0392b" stroke-width="5"/><text x="516" y="138">HP (haute pression)</text>
    <line x1="480" y1="154" x2="510" y2="154" stroke="#2471a3" stroke-width="5"/><text x="516" y="158">BP (basse pression)</text>
  </g>
</svg>
<figcaption>Fig. 1 — Circuit frigorifique de base : 1 aspiration · 2 refoulement · 3 entrée détendeur · 4 sortie détendeur.</figcaption>
</figure>


<!-- =========================================================
     FIG 2 — Diagramme enthalpique (log p / h) avec cycle
     ========================================================= -->
<figure id="fig-mollier">
<svg viewBox="0 0 600 380" role="img" aria-label="Diagramme enthalpique pression-enthalpie">
  <!-- axes -->
  <line x1="70" y1="330" x2="560" y2="330" stroke="#333" stroke-width="1.6"/>
  <line x1="70" y1="330" x2="70" y2="30" stroke="#333" stroke-width="1.6"/>
  <text x="315" y="366" text-anchor="middle" font-size="12">Enthalpie h (kJ/kg)</text>
  <text x="22" y="180" text-anchor="middle" font-size="12" transform="rotate(-90 22 180)">Pression P (bar) — échelle log</text>

  <!-- courbe de saturation (cloche) -->
  <path d="M150,320 C160,180 250,70 320,66 C400,62 470,150 500,320"
        fill="none" stroke="#5d6d7e" stroke-width="2"/>
  <text x="205" y="150" font-size="11" fill="#5d6d7e">liquide sat.</text>
  <text x="430" y="150" font-size="11" fill="#5d6d7e">vapeur sat.</text>
  <text x="318" y="58" font-size="11" fill="#5d6d7e" text-anchor="middle">C (point critique)</text>

  <!-- cycle : isobares HP (haut) et BP (bas) -->
  <!-- BP y=270 ; HP y=120 -->
  <!-- 4->1 évaporation (dans la cloche, horizontal BP) -->
  <line x1="175" y1="270" x2="455" y2="270" stroke="#2471a3" stroke-width="3"/>
  <!-- 1->2 compression (BP->HP, vers la droite, montée) -->
  <path d="M455,270 C500,230 520,170 500,120" fill="none" stroke="#7d3c98" stroke-width="3"/>
  <!-- 2->3 désurchauffe+condensation (HP horizontal) -->
  <line x1="500" y1="120" x2="230" y2="120" stroke="#c0392b" stroke-width="3"/>
  <!-- 3->4 détente (verticale, iso-h) -->
  <line x1="175" y1="120" x2="175" y2="270" stroke="#333" stroke-width="2.4" stroke-dasharray="6 4"/>
  <!-- raccord condensation -> sous-refroidissement -->
  <line x1="230" y1="120" x2="175" y2="120" stroke="#c0392b" stroke-width="3"/>

  <!-- points -->
  <g font-size="12" font-weight="800">
    <circle cx="455" cy="270" r="9" fill="#fff" stroke="#2471a3" stroke-width="2"/><text x="470" y="288">1</text>
    <circle cx="500" cy="120" r="9" fill="#fff" stroke="#7d3c98" stroke-width="2"/><text x="512" y="115">2</text>
    <circle cx="230" cy="120" r="9" fill="#fff" stroke="#c0392b" stroke-width="2"/><text x="228" y="108">3</text>
    <circle cx="175" cy="270" r="9" fill="#fff" stroke="#333" stroke-width="2"/><text x="150" y="288">4</text>
  </g>
  <!-- annotations surchauffe / sous-refroidissement -->
  <text x="470" y="258" font-size="10" fill="#2471a3">surchauffe</text>
  <text x="180" y="112" font-size="10" fill="#c0392b">sous-refr.</text>
  <!-- isobares repères -->
  <text x="86" y="124" font-size="10" fill="#c0392b">PK</text>
  <text x="86" y="274" font-size="10" fill="#2471a3">P0</text>
  <line x1="66" y1="120" x2="74" y2="120" stroke="#c0392b" stroke-width="2"/>
  <line x1="66" y1="270" x2="74" y2="270" stroke="#2471a3" stroke-width="2"/>
</svg>
<figcaption>Fig. 2 — Cycle frigorifique sur diagramme enthalpique (P, h) : 1→2 compression · 2→3 condensation · 3→4 détente · 4→1 évaporation.</figcaption>
</figure>


<!-- =========================================================
     FIG 3 — Détendeur thermostatique et mesure de surchauffe
     ========================================================= -->
<figure id="fig-detendeur">
<svg viewBox="0 0 560 300" role="img" aria-label="Détendeur thermostatique et prise de surchauffe">
  <!-- évaporateur -->
  <rect x="60" y="150" width="200" height="60" rx="6" fill="#eaf3fb" stroke="#2471a3" stroke-width="2.5"/>
  <path d="M75,180 h18 v-14 h18 v28 h18 v-28 h18 v28 h18 v-28 h18 v14 h18" fill="none" stroke="#2471a3" stroke-width="2"/>
  <text x="160" y="196" text-anchor="middle" font-size="12" font-weight="700" fill="#2471a3">Évaporateur</text>

  <!-- détendeur (corps) -->
  <rect x="300" y="150" width="70" height="60" rx="6" fill="#eef2f6" stroke="#333" stroke-width="2.5"/>
  <path d="M320,180 l16,18 h-32 Z" fill="#fff" stroke="#333" stroke-width="1.8"/>
  <path d="M320,180 l16,-18 h-32 Z" fill="#fff" stroke="#333" stroke-width="1.8"/>
  <text x="335" y="230" text-anchor="middle" font-size="11" font-weight="700">Détendeur</text>

  <!-- membrane + vis de réglage -->
  <ellipse cx="335" cy="120" rx="26" ry="12" fill="#fdf3d0" stroke="#333" stroke-width="1.8"/>
  <line x1="335" y1="120" x2="335" y2="150" stroke="#333" stroke-width="2"/>
  <line x1="335" y1="150" x2="335" y2="210" stroke="#333" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="368" y="118" font-size="10">réglage ± tours</text>

  <!-- bulbe + capillaire -->
  <path d="M361,120 C420,110 200,70 175,140" fill="none" stroke="#7d3c98" stroke-width="2"/>
  <rect x="150" y="128" width="30" height="16" rx="8" fill="#7d3c98"/>
  <text x="120" y="120" font-size="10" fill="#7d3c98">bulbe</text>

  <!-- ligne aspiration + point de mesure T -->
  <line x1="60" y1="150" x2="60" y2="120" stroke="#2471a3" stroke-width="4"/>
  <line x1="60" y1="120" x2="165" y2="120" stroke="#2471a3" stroke-width="4"/>
  <circle cx="180" cy="120" r="10" fill="#fff" stroke="#e67e22" stroke-width="2.5"/>
  <text x="180" y="124" text-anchor="middle" font-size="10" font-weight="800" fill="#e67e22">t</text>
  <text x="200" y="104" font-size="10" fill="#e67e22">mesure T° sortie évap.</text>

  <!-- formule -->
  <rect x="360" y="235" width="190" height="46" rx="6" fill="#fdf3d0" stroke="#f1c40f"/>
  <text x="370" y="255" font-size="12" font-weight="800" fill="#9a7d0a">Surchauffe = T°sortie évap − T0</text>
  <text x="370" y="273" font-size="11" fill="#9a7d0a">cible : 4 à 8 K</text>
</svg>
<figcaption>Fig. 3 — Détendeur thermostatique : mesure de la surchauffe entre la sortie d'évaporateur et la température d'évaporation T0.</figcaption>
</figure>
