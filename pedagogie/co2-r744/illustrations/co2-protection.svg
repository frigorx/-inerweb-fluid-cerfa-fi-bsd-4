</metadata>
  <title>Préalarme, alarme, et celle qui prévient AVANT d'ouvrir la porte</title>
  <style>
    .t   { font:700 19px Calibri,Segoe UI,sans-serif; fill:#1b3a63; }
    .st  { font:700 14px Calibri,Segoe UI,sans-serif; fill:#1b3a63; }
    .lg  { font:400 13px Calibri,Segoe UI,sans-serif; fill:#4a5b6e; }
    .bad { font:700 14px Calibri,Segoe UI,sans-serif; fill:#c9451a; }
    .p   { fill:none; stroke:#1b3a63; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
    .acc { fill:none; stroke:#c9451a; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }

    /* Le signal qui remonte du capteur vers la sirène : les tirets défilent. */
    .flux   { animation: flux 1.1s linear 3s infinite; }
    @keyframes flux { to { stroke-dashoffset: -18; } }
    /* L'alarme d'évacuation ne s'allume pas : elle CLIGNOTE, en permanence. */
    .clign  { animation: clign 1s linear 8.6s infinite; }
    @keyframes clign { 0%,50% { opacity:1; } 50.01%,100% { opacity:0.15; } }
    /* L'alarme extérieure : dernier maillon, point capital de la fiche. */
    .dehors { animation: dehors 1.6s ease-in-out 11.6s infinite; }
    @keyframes dehors { 0%,100% { opacity:1; } 50% { opacity:0.4; } }

    /* FILET D'IMPRESSION — conditionné à `print`, JAMAIS à
       prefers-reduced-motion, qui supprimerait la démonstration à l'écran sur
       toute machine aux effets d'animation Windows désactivés.

       ⚠ `animate { display:none }` NE NEUTRALISE PAS le SMIL (vérifié sous
       Chromium le 27/07 : l'animation continue de tourner). Une planche qui
       s'en remet à cette règle s'imprime dans son état de DÉPART — local sain,
       alarmes éteintes : le contresens exact de ce qu'elle enseigne.
       Seule une déclaration !important passe devant le SMIL. On épingle donc
       l'état final propriété par propriété. Les classes ci-dessous n'existent
       que pour cela : à l'écran elles ne déclarent rien. */
    @media print {
      .i-nappe   { y: 176px !important; height: 32px !important; }
      .i-surface { y: 175px !important; }
      .i-rouge   { fill: #c9451a !important; }
      .i-orange  { fill: #ff6b35 !important; }
      .i-blanc   { stroke: #ffffff !important; }
      .i-vu      { opacity: 1 !important; }
      .i-cache   { opacity: 0 !important; }
      .flux, .clign, .dehors { animation: none !important; }
    }
  </style>

  <rect width="880" height="360" fill="#ffffff"/>
  <text class="t" x="30" y="30">On protège d'abord TOUT LE MONDE, ensuite soi-même</text>

  <!-- ===== EPC : le local équipé ===== -->
  <g transform="translate(30,50)">
    <rect x="0" y="0" width="560" height="238" rx="8" fill="#eef6f1" stroke="#a9cdb8" stroke-width="1.5"/>
    <text class="st" x="18" y="26">EPC — protection collective : elle protège même quand personne n'y pense</text>

    <!-- local -->
    <path class="p" d="M120,54 v154 h380 v-154"/>
    <line class="p" x1="110" y1="208" x2="510" y2="208"/>
    <line class="p" x1="120" y1="54" x2="500" y2="54"/>

    <!-- LA CONCENTRATION QUI MONTE. Base = état FINAL (nappe haute) : sans
         animation, une nappe au ras du sol ferait croire à un local sûr. -->
    <rect class="i-nappe" x="122" y="176" width="376" height="32" fill="#7fa9c9" opacity="0.7">
      <animate attributeName="y"      values="204;204;176;176" keyTimes="0;0.043;0.357;1" dur="14s" fill="freeze"/>
      <animate attributeName="height" values="4;4;32;32"       keyTimes="0;0.043;0.357;1" dur="14s" fill="freeze"/>
    </rect>
    <!-- La surface est un rect et non un trait : `y` est une propriété CSS de
         géométrie sur un rect, ce qui permet de l'épingler à l'impression. -->
    <rect class="i-surface" x="122" y="175" width="376" height="2" fill="#3f7fae">
      <animate attributeName="y" values="203;203;175;175" keyTimes="0;0.043;0.357;1" dur="14s" fill="freeze"/>
    </rect>

    <!-- porte + ALARME EXTÉRIEURE : le dernier maillon, et le plus important -->
    <rect x="96" y="140" width="24" height="68" fill="#e8eef4" stroke="#1b3a63" stroke-width="2"/>
    <g class="dehors" transform="translate(84,104)">
      <circle class="acc i-rouge" cx="12" cy="12" r="11" style="fill:#c9451a">
        <animate attributeName="fill" values="#ffffff;#ffffff;#c9451a;#c9451a" keyTimes="0;0.786;0.829;1" dur="14s" fill="freeze"/>
      </circle>
      <path class="acc i-blanc" d="M12,5 v8 M12,17 v1" style="stroke:#ffffff">
        <animate attributeName="stroke" values="#c9451a;#c9451a;#ffffff;#ffffff" keyTimes="0;0.786;0.829;1" dur="14s" fill="freeze"/>
      </path>
      <path class="acc i-vu" d="M-2,4 a16,16 0 0 1 0,16 M26,4 a16,16 0 0 0 0,16" opacity="1">
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.786;0.829;1" dur="14s" fill="freeze"/>
      </path>
    </g>
    <text class="bad" x="52" y="90" text-anchor="middle" style="font-size:12px">alarme</text>
    <text class="bad" x="52" y="104" text-anchor="middle" style="font-size:12px">DEHORS</text>
    <text class="lg i-rouge" x="40" y="176" style="font-size:12px;fill:#c9451a">
      <animate attributeName="fill" values="#4a5b6e;#4a5b6e;#c9451a;#c9451a" keyTimes="0;0.786;0.829;1" dur="14s" fill="freeze"/>
      on sait</text>
    <text class="lg i-rouge" x="40" y="192" style="font-size:12px;fill:#c9451a">
      <animate attributeName="fill" values="#4a5b6e;#4a5b6e;#c9451a;#c9451a" keyTimes="0;0.786;0.829;1" dur="14s" fill="freeze"/>
      avant d'ouvrir</text>

    <!-- signalisation sur la porte -->
    <g transform="translate(100,58)">
      <path d="M12,2 L23,22 L1,22 Z" fill="#ffdf00" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
      <text x="12" y="19" text-anchor="middle" style="font:700 10px Calibri;fill:#111">!</text>
    </g>

    <!-- capteur EN BAS + son afficheur : trois barres qui se remplissent,
         SANS graduation ni nombre. Aucun seuil en ppm sur une planche — ils se
         lisent sur l'appareil, sa documentation et la FDS. -->
    <g transform="translate(430,154)">
      <rect class="p" x="0" y="0" width="34" height="24" rx="3"/>
      <rect class="i-orange" x="6" y="13" width="6" height="6" stroke="#8aa0b4" stroke-width="1" fill="#ff6b35">
        <animate attributeName="fill" values="#e8eef4;#e8eef4;#ff6b35;#ff6b35" keyTimes="0;0.200;0.229;1" dur="14s" fill="freeze"/>
      </rect>
      <rect class="i-orange" x="15" y="8" width="6" height="11" stroke="#8aa0b4" stroke-width="1" fill="#ff6b35">
        <animate attributeName="fill" values="#e8eef4;#e8eef4;#ff6b35;#ff6b35" keyTimes="0;0.386;0.421;1" dur="14s" fill="freeze"/>
      </rect>
      <rect class="i-rouge" x="24" y="3" width="6" height="16" stroke="#8aa0b4" stroke-width="1" fill="#c9451a">
        <animate attributeName="fill" values="#e8eef4;#e8eef4;#c9451a;#c9451a" keyTimes="0;0.586;0.621;1" dur="14s" fill="freeze"/>
      </rect>
    </g>
    <g transform="translate(430,178)">
      <rect class="p" x="0" y="0" width="34" height="24" rx="3" fill="#fff"/>
      <circle class="i-rouge" cx="10" cy="12" r="4" fill="#c9451a">
        <animate attributeName="fill" values="#c9d4de;#c9d4de;#c9451a;#c9451a" keyTimes="0;0.200;0.229;1" dur="14s" fill="freeze"/>
      </circle>
      <text x="24" y="16" text-anchor="middle" style="font:700 10px Calibri;fill:#1b3a63">ppm</text>
    </g>
    <text class="st" x="447" y="222" text-anchor="middle" style="font-size:11.5px">capteur EN BAS</text>

    <!-- ALARME INTÉRIEURE : un seul appareil, DEUX niveaux — blanc au repos,
         orange (préalarme, qui avertit), rouge clignotant (évacuation). -->
    <g class="clign" transform="translate(300,66)">
      <circle class="acc i-rouge" cx="12" cy="12" r="11" style="fill:#c9451a">
        <animate attributeName="fill" values="#ffffff;#ffffff;#ff6b35;#ff6b35;#c9451a;#c9451a" keyTimes="0;0.386;0.421;0.586;0.621;1" dur="14s" fill="freeze"/>
      </circle>
      <path class="acc i-blanc" d="M12,5 v8 M12,17 v1" style="stroke:#ffffff">
        <animate attributeName="stroke" values="#c9451a;#c9451a;#ffffff;#ffffff" keyTimes="0;0.386;0.421;1" dur="14s" fill="freeze"/>
      </path>
      <path class="acc i-vu" d="M-2,4 a16,16 0 0 1 0,16 M26,4 a16,16 0 0 0 0,16" opacity="1">
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.586;0.621;1" dur="14s" fill="freeze"/>
      </path>
    </g>
    <text class="st i-cache" x="288" y="83" text-anchor="end" opacity="0" style="font-size:13px;fill:#ff6b35">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.386;0.421;0.571;0.593;1" dur="14s" fill="freeze"/>
      préalarme</text>
    <text class="st i-vu" x="288" y="83" text-anchor="end" opacity="1" style="font-size:13px;fill:#c9451a">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.600;0.636;1" dur="14s" fill="freeze"/>
      alarme d'évacuation</text>
    <text class="lg" x="312" y="104" text-anchor="middle" style="font-size:12px">alarme intérieure</text>

    <!-- ventilation -->
    <g transform="translate(452,64)">
      <rect class="p" x="0" y="0" width="40" height="30" rx="3"/>
      <line class="p" x1="6" y1="9"  x2="34" y2="9"/>
      <line class="p" x1="6" y1="16" x2="34" y2="16"/>
      <line class="p" x1="6" y1="23" x2="34" y2="23"/>
      <path class="p" d="M44,15 h16 m-6,-6 l6,6 -6,6"/>
    </g>
    <text class="lg" x="472" y="112" text-anchor="middle" style="font-size:12px">ventilation</text>

    <!-- lien capteur -> alarmes : il part de l'afficheur et remonte vers la
         sirène intérieure (il plongeait auparavant dans la nappe). -->
    <path class="acc flux" d="M447,154 v-16 h-135 v-18" stroke-dasharray="5 4"/>
  </g>

  <!-- ===== EPI ===== -->
  <g transform="translate(618,50)">
    <rect x="0" y="0" width="232" height="112" rx="8" fill="#f7fafc" stroke="#c9d4de" stroke-width="1.5"/>
    <text class="st" x="18" y="26">EPI — pour vous seul</text>
    <g transform="translate(24,44)">
      <rect class="p" x="0" y="6" width="16" height="12" rx="3"/>
      <rect class="p" x="20" y="6" width="16" height="12" rx="3"/>
      <line class="p" x1="16" y1="12" x2="20" y2="12"/>
    </g>
    <text class="lg" x="72" y="60">lunettes</text>
    <g transform="translate(24,74)">
      <path class="p" d="M2,22 v-10 a2,2 0 0 1 4,0 v-7 a2,2 0 0 1 4,0 v6 a2,2 0 0 1 4,0 v1 a2,2 0 0 1 4,0 v8 a5,5 0 0 1 -5,5 h-6 a5,5 0 0 1 -5,-3 z"/>
    </g>
    <text class="lg" x="72" y="92">gants adaptés au froid</text>
  </g>

  <!-- ===== le masque ===== -->
  <g transform="translate(618,176)">
    <rect x="0" y="0" width="232" height="112" rx="8" fill="#fdf1ed" stroke="#e8b9a8" stroke-width="1.5"/>
    <g transform="translate(24,26)">
      <path class="acc" d="M4,14 a16,12 0 0 1 32,0 a14,16 0 0 1 -16,16 a14,16 0 0 1 -16,-16 z"/>
      <circle class="acc" cx="20" cy="34" r="6"/>
      <line class="acc" x1="0" y1="44" x2="42" y2="0"/>
    </g>
    <text class="bad" x="86" y="40">Un masque à</text>
    <text class="bad" x="86" y="58">cartouche ne protège</text>
    <text class="bad" x="86" y="76">PAS du CO₂.</text>
    <text class="lg"  x="18" y="100">Il ne fabrique pas d'oxygène. La protection, c'est de ne pas entrer.</text>
  </g>

  <text class="lg" x="30" y="312">Un capteur se vérifie et se remplace selon la documentation du fabricant : une cellule usée reste allumée sans plus rien mesurer.</text>
  <text class="lg" x="30" y="334">À l'arrivée, on contrôle trois choses : la signalisation est à jour, les issues de secours sont dégagées, les capteurs et alarmes fonctionnent.</text>
</svg>
