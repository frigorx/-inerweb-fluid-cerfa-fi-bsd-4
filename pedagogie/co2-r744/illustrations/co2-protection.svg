<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" role="img"
     aria-label="Le dispositif de protection d'un local au CO2, et la chaîne de détection animée. La concentration monte depuis le sol ; le capteur fixe placé en partie basse la voit et son afficheur se remplit, sans aucune valeur chiffrée ; la préalarme se déclenche en orange ; l'alarme d'évacuation passe au rouge et clignote ; enfin l'alarme extérieure, au-dessus de la porte, s'allume : c'est elle qui prévient avant d'ouvrir. À droite, les EPI — et le masque à cartouche, qui ne protège ni du CO2 ni du manque d'oxygène.">
<metadata>
  <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
           xmlns:cc="http://creativecommons.org/ns#"
           xmlns:dc="http://purl.org/dc/elements/1.1/">
    <cc:Work rdf:about="">
      <dc:title>Le dispositif de protection d'un local au CO2, et la chaîne de détection animée</dc:title>
