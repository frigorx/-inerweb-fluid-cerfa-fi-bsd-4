<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" role="img"
     aria-label="Animation : dans un local en contrebas, le CO2 étant plus lourd que l'air, il s'écoule vers le bas et la nappe monte depuis le sol. Un technicien descend l'escalier et entre dans la nappe. Une zone peut être respirable à hauteur de visage et déjà mortelle en bas de l'escalier.">
<metadata>
  <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
           xmlns:cc="http://creativecommons.org/ns#"
           xmlns:dc="http://purl.org/dc/elements/1.1/">
    <cc:Work rdf:about="">
      <dc:title>Animation : dans un local en contrebas, le CO2 étant plus lourd que l'air, il s'écoule vers le bas et la nappe monte depuis le sol</dc:title>
