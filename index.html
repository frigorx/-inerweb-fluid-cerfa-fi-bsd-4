<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0e2a47">
  <meta name="description" content="inerWeb Fluide — traçabilité des fluides frigorigènes et CERFA 15497*04. L'application est sous /v8/.">
  <meta http-equiv="refresh" content="0; url=v8/">
  <link rel="canonical" href="v8/">
  <title>inerWeb Fluide — redirection vers l'application</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f7fa;
      color: #0e2a47;
      font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .carte {
      max-width: 30rem;
      background: #ffffff;
      border: 1px solid #dde5ee;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 2px 12px rgba(14, 42, 71, .08);
    }
    h1 { font-size: 1.35rem; margin: 0 0 12px; }
    p { margin: 0 0 20px; line-height: 1.55; color: #40566f; }
    a.bouton {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 8px;
      background: #12b5c9;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
    }
    a.bouton:hover { filter: brightness(1.06); }
  </style>
</head>
<body>
  <main class="carte">
    <h1>inerWeb Fluide</h1>
    <p>
      L'application se trouve sous <strong>/v8/</strong>.
      Redirection automatique en cours&hellip;
    </p>
    <a class="bouton" href="v8/">Ouvrir l'application</a>
  </main>
  <script>
    // Redirection immédiate ; la balise meta ci-dessus assure le repli si le
    // script est bloqué. `replace` : on ne pollue pas l'historique du visiteur.
    location.replace('v8/');
  </script>
</body>
</html>
