  <title id="title">Croix du frigoriste : organes, états et énergie</title><desc id="desc">Circuit frigorifique conventionnel : condenseur en haut, compresseur à droite, évaporateur en bas, détendeur à gauche. Les états vapeur et liquide et les échanges de chaleur sont indiqués.</desc>
  <metadata><dc:title>Croix du frigoriste : organes, états et énergie</dc:title><dc:description>Circuit frigorifique conventionnel : condenseur en haut, compresseur à droite, évaporateur en bas, détendeur à gauche. Les états vapeur et liquide et les échanges de chaleur sont indiqués.</dc:description><dc:creator>F. Henninot (direction métier) et OpenAI Codex (dessin SVG original)</dc:creator><dc:source>Création originale inerWeb, pack HabFluide intérieur v2</dc:source><dc:rights>© 2026 Franck Henninot, inerWeb. Tous droits réservés.</dc:rights></metadata>
