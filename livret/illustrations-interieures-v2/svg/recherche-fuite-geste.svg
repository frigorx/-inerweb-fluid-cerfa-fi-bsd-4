<svg xmlns="http://www.w3.org/2000/svg" xmlns:dc="http://purl.org/dc/elements/1.1/" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Détecteur : contrôler, balayer, confirmer</title><desc id="desc">Le détecteur est testé avant utilisation. La sonde passe lentement autour du raccord et en partie basse. Une alerte se confirme et le résultat est consigné.</desc>
  <metadata><dc:title>Détecteur : contrôler, balayer, confirmer</dc:title><dc:description>Le détecteur est testé avant utilisation. La sonde passe lentement autour du raccord et en partie basse. Une alerte se confirme et le résultat est consigné.</dc:description><dc:creator>F. Henninot (direction métier) et OpenAI Codex (dessin SVG original)</dc:creator><dc:source>Création originale inerWeb, pack HabFluide intérieur v2</dc:source><dc:rights>© 2026 Franck Henninot, inerWeb. Tous droits réservés.</dc:rights></metadata>
