  <text x="50" y="72" class="title" text-anchor="start" style="font-size:47px">Détecteur : contrôler, balayer, confirmer</text><g><rect x="40" y="140" width="330" height="480" rx="18" class="panel safe"/><text x="64" y="186" class="panel-title" text-anchor="start">1  CONTRÔLER</text><text x="64" y="228" class="small" text-anchor="start" style="font-size:20px">Appareil + gaz recherché</text></g><g transform="translate(155 270)"><rect x="0" y="20" width="72" height="126" rx="14" class="device"/><rect x="16" y="43" width="40" height="28" rx="4" class="screen"/><path d="M 36 20 C 40 -20, 92 -26, 112 4" class="pipe" fill="none"/><circle cx="114" cy="5" r="8" fill="#C9451A"/><text x="36" y="178" class="small" text-anchor="middle">Test avant usage</text></g><g><rect x="435" y="140" width="330" height="480" rx="18" class="panel"/><text x="459" y="186" class="panel-title" text-anchor="start">2  BALAYER</text><text x="459" y="228" class="small" text-anchor="start" style="font-size:18px">Lentement autour du raccord</text></g><path d="M 505 375 H 700" class="pipe"/><circle cx="600" cy="375" r="28" class="device"/><path d="M 490 470 C 520 300 690 285 720 470" class="accent"/><g><rect x="830" y="140" width="330" height="480" rx="18" class="panel safe"/><text x="854" y="186" class="panel-title" text-anchor="start">3  CONFIRMER</text><text x="854" y="228" class="small" text-anchor="start" style="font-size:21px">Puis écrire au registre</text></g><g><rect x="900" y="280" width="160" height="50" rx="25" class="badge orange"/><text x="918" y="315" class="badge-text" text-anchor="start">ALERTE</text></g><text x="995" y="410" class="small" text-anchor="middle">Localiser</text><text x="995" y="465" class="small" text-anchor="middle">Réparer</text><text x="995" y="520" class="small" text-anchor="middle">Recontrôler</text><text x="600" y="690" class="body" text-anchor="middle">Méthode indirecte : soupçonner — méthode directe : localiser</text>
</svg>