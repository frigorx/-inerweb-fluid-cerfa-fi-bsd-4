  <text x="50" y="72" class="title" text-anchor="start" style="font-size:38px">La ligne liquide : chaque organe protège le suivant</text><text x="80" y="150" class="small" text-anchor="start">SORTIE CONDENSEUR</text><line x1="80" y1="330" x2="1110" y2="330" class="flow" marker-end="url(#arrow)"/><g><rect x="85" y="245" width="150" height="170" rx="18" class="device"/><text x="160" y="300" class="tiny" text-anchor="middle">RÉSERVOIR</text><text x="160" y="465" class="tiny" text-anchor="middle">stocker</text></g><g><rect x="305" y="245" width="150" height="170" rx="18" class="device"/><text x="380" y="300" class="tiny" text-anchor="middle">FILTRE</text><text x="380" y="465" class="tiny" text-anchor="middle" style="font-size:21px">retient humidité</text></g><g><rect x="525" y="245" width="150" height="170" rx="18" class="device"/><text x="600" y="300" class="tiny" text-anchor="middle">VOYANT</text><text x="600" y="465" class="tiny" text-anchor="middle">observer</text></g><g><rect x="745" y="245" width="150" height="170" rx="18" class="device"/><text x="820" y="300" class="tiny" text-anchor="middle">ÉLECTRO-</text><text x="820" y="335" class="tiny" text-anchor="middle">VANNE</text><text x="820" y="465" class="tiny" text-anchor="middle">fermer</text></g><g><rect x="965" y="245" width="150" height="170" rx="18" class="device"/><text x="1040" y="300" class="tiny" text-anchor="middle">DÉTENDEUR</text><text x="1040" y="465" class="tiny" text-anchor="middle" style="font-size:21px">abaisse pression</text></g><g><rect x="385" y="555" width="402" height="50" rx="25" class="badge green"/><text x="403" y="590" class="badge-text" text-anchor="start">ORDRE FONCTIONNEL</text></g><text x="600" y="665" class="body" text-anchor="middle" style="font-size:29px">Débrancher un organe sans comprendre son rôle = diagnostic perdu</text>
