<svg xmlns="http://www.w3.org/2000/svg" xmlns:dc="http://purl.org/dc/elements/1.1/" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Quatre compresseurs, une même fonction</title><desc id="desc">Comparaison schématique de quatre technologies de compresseur : piston, scroll, vis et rotatif. Tous aspirent une vapeur basse pression et refoulent une vapeur haute pression.</desc>
