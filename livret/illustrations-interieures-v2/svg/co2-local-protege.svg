<svg xmlns="http://www.w3.org/2000/svg" xmlns:dc="http://purl.org/dc/elements/1.1/" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Local CO₂ : voir l’alarme avant d’entrer</title><desc id="desc">Le technicien reste à l’extérieur. La signalisation et l’alarme sont visibles avant ouverture. La ventilation, la détection et l’implantation du capteur sont vérifiées selon l’installation et la norme applicable.</desc>
  <metadata><dc:title>Local CO₂ : voir l’alarme avant d’entrer</dc:title><dc:description>Le technicien reste à l’extérieur. La signalisation et l’alarme sont visibles avant ouverture. La ventilation, la détection et l’implantation du capteur sont vérifiées selon l’installation et la norme applicable.</dc:description><dc:creator>F. Henninot (direction métier) et OpenAI Codex (dessin SVG original)</dc:creator><dc:source>Création originale inerWeb, pack HabFluide intérieur v2</dc:source><dc:rights>© 2026 Franck Henninot, inerWeb. Tous droits réservés.</dc:rights></metadata>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3D7FCA"/></marker><pattern id="gas" width="38" height="38" patternUnits="userSpaceOnUse"><circle cx="7" cy="8" r="4" fill="#84B7EC"/><circle cx="28" cy="25" r="5" fill="#3D7FCA" opacity=".45"/></pattern></defs>
  <style>
  .title{font:700 54px 'Trebuchet MS',Arial,sans-serif;fill:#1B3A63}
  .subtitle{font:600 32px Calibri,Arial,sans-serif;fill:#10233C}
  .body{font:600 36px Calibri,Arial,sans-serif;fill:#10233C}
