<svg xmlns="http://www.w3.org/2000/svg" xmlns:dc="http://purl.org/dc/elements/1.1/" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Diagramme log p-h : lire sans inventer</title><desc id="desc">Le diagramme log p-h montre la pression en ordonnée logarithmique et l’enthalpie en abscisse. Les zones liquide, mélange et vapeur sont séparées par les courbes de bulle et de rosée.</desc>
  <metadata><dc:title>Diagramme log p-h : lire sans inventer</dc:title><dc:description>Le diagramme log p-h montre la pression en ordonnée logarithmique et l’enthalpie en abscisse. Les zones liquide, mélange et vapeur sont séparées par les courbes de bulle et de rosée.</dc:description><dc:creator>F. Henninot (direction métier) et OpenAI Codex (dessin SVG original)</dc:creator><dc:source>Création originale inerWeb, pack HabFluide intérieur v2</dc:source><dc:rights>© 2026 Franck Henninot, inerWeb. Tous droits réservés.</dc:rights></metadata>
