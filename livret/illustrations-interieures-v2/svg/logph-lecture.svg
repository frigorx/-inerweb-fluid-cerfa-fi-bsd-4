  <text x="50" y="72" class="title" text-anchor="start" style="font-size:51px">Diagramme log p-h : lire sans inventer</text><line x1="125" y1="600" x2="1080" y2="600" class="pipe"/><line x1="125" y1="600" x2="125" y2="135" class="pipe"/><text x="600" y="675" class="body" text-anchor="middle">ENTHALPIE h (kJ/kg)</text><text x="55" y="380" class="body" text-anchor="middle">log p</text><path d="M 360 580 C 385 470 420 280 565 170 C 710 280 748 470 780 580" fill="none" stroke="#1B3A63" stroke-width="8"/><path d="M 240 500 H 900 L 1020 295" class="accent"/><path d="M 1018 295 V 230 H 850" class="accent"/><path d="M 850 230 H 345" class="accent"/><path d="M 345 230 L 240 500" class="accent"/><text x="285" y="390" class="panel-title" text-anchor="middle">LIQUIDE</text><text x="565" y="430" class="panel-title" text-anchor="middle">MÉLANGE</text><text x="900" y="430" class="panel-title" text-anchor="middle">VAPEUR</text><text x="405" y="205" class="tiny" text-anchor="middle">BULLE</text><text x="715" y="205" class="tiny" text-anchor="middle">ROSÉE</text><g><rect x="845" y="120" width="380" height="50" rx="25" class="badge orange"/><text x="863" y="155" class="badge-text" text-anchor="start">PRESSION ABSOLUE</text></g>
