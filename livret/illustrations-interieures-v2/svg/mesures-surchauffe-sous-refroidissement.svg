  <title id="title">Deux écarts, deux points de mesure</title><desc id="desc">La surchauffe est mesurée en sortie d’évaporateur côté aspiration avec pression et température. Le sous-refroidissement est mesuré en sortie de condenseur côté liquide. Les valeurs constructeur font foi.</desc>
  <metadata><dc:title>Deux écarts, deux points de mesure</dc:title><dc:description>La surchauffe est mesurée en sortie d’évaporateur côté aspiration avec pression et température. Le sous-refroidissement est mesuré en sortie de condenseur côté liquide. Les valeurs constructeur font foi.</dc:description><dc:creator>F. Henninot (direction métier) et OpenAI Codex (dessin SVG original)</dc:creator><dc:source>Création originale inerWeb, pack HabFluide intérieur v2</dc:source><dc:rights>© 2026 Franck Henninot, inerWeb. Tous droits réservés.</dc:rights></metadata>
