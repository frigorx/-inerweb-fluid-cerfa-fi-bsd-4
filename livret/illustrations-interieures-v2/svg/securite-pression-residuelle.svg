  <title id="title">À l’arrêt, le circuit reste sous pression</title><desc id="desc">Une installation arrêtée reste sous pression. La température ambiante peut augmenter la pression. Avant ouverture : isoler, mesurer, récupérer et vérifier.</desc>
  <metadata><dc:title>À l’arrêt, le circuit reste sous pression</dc:title><dc:description>Une installation arrêtée reste sous pression. La température ambiante peut augmenter la pression. Avant ouverture : isoler, mesurer, récupérer et vérifier.</dc:description><dc:creator>F. Henninot (direction métier) et OpenAI Codex (dessin SVG original)</dc:creator><dc:source>Création originale inerWeb, pack HabFluide intérieur v2</dc:source><dc:rights>© 2026 Franck Henninot, inerWeb. Tous droits réservés.</dc:rights></metadata>
