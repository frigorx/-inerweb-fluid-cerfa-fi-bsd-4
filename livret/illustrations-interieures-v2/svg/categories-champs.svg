<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:dc="http://purl.org/dc/elements/1.1/" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Une catégorie = un fluide et un champ d’activité</title><desc id="desc">Les catégories A1 et A2 concernent les fluides fluorés et les hydrocarbures, B le CO2, C l’ammoniac, D la récupération, E le contrôle d’étanchéité sans ouvrir et V la climatisation des véhicules.</desc>
  <metadata><dc:title>Une catégorie = un fluide et un champ d’activité</dc:title><dc:description>Les catégories A1 et A2 concernent les fluides fluorés et les hydrocarbures, B le CO2, C l’ammoniac, D la récupération, E le contrôle d’étanchéité sans ouvrir et V la climatisation des véhicules.</dc:description><dc:creator>F. Henninot (direction métier) et OpenAI Codex (dessin SVG original)</dc:creator><dc:source>Création originale inerWeb, pack HabFluide intérieur v2</dc:source><dc:rights>© 2026 Franck Henninot, inerWeb. Tous droits réservés.</dc:rights></metadata>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3D7FCA"/></marker><pattern id="gas" width="38" height="38" patternUnits="userSpaceOnUse"><circle cx="7" cy="8" r="4" fill="#84B7EC"/><circle cx="28" cy="25" r="5" fill="#3D7FCA" opacity=".45"/></pattern></defs>
  <style>
  .title{font:700 54px 'Trebuchet MS',Arial,sans-serif;fill:#1B3A63}
  .subtitle{font:600 32px Calibri,Arial,sans-serif;fill:#10233C}
  .body{font:600 36px Calibri,Arial,sans-serif;fill:#10233C}
  .small{font:600 30px Calibri,Arial,sans-serif;fill:#10233C}
  .tiny{font:600 25px Calibri,Arial,sans-serif;fill:#10233C}
  .panel-title{font:700 34px 'Trebuchet MS',Arial,sans-serif;fill:#1B3A63}
  .equip{font:700 27px Calibri,Arial,sans-serif;fill:#1B3A63}
  .badge-text{font:700 27px Calibri,Arial,sans-serif;fill:white}
  .stop-text{font:700 25px Calibri,Arial,sans-serif;fill:#C0392B}
  .panel{fill:white;stroke:#1B3A63;stroke-width:4}
  .panel.danger{stroke:#C0392B;stroke-width:6;stroke-dasharray:18 12}
  .panel.safe{stroke:#1E7E54;stroke-width:7;stroke-dasharray:3 8}
  .badge.navy{fill:#1B3A63} .badge.orange{fill:#C9451A} .badge.green{fill:#1E7E54}
  .pipe{fill:none;stroke:#1B3A63;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
  .thin{fill:none;stroke:#1B3A63;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  .accent{fill:none;stroke:#C9451A;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
  .flow{fill:none;stroke:#3D7FCA;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
  .danger-line{fill:none;stroke:#C0392B;stroke-width:8;stroke-dasharray:18 12}
  .safe-line{fill:none;stroke:#1E7E54;stroke-width:8;stroke-dasharray:3 11}
  .device{fill:white;stroke:#1B3A63;stroke-width:6}
  .screen{fill:#F3F7FB;stroke:#3D7FCA;stroke-width:4}
  .person{fill:white;stroke:#1B3A63;stroke-width:6}
  .person-line{fill:none;stroke:#1B3A63;stroke-width:12;stroke-linecap:round}
  .helmet{fill:#F3F7FB;stroke:#1B3A63;stroke-width:5}
  .stop{fill:white;stroke:#C0392B;stroke-width:7;stroke-dasharray:16 9}
  .step{fill:white;stroke:#1B3A63;stroke-width:5}
  .step-safe{fill:white;stroke:#1E7E54;stroke-width:7;stroke-dasharray:3 9}
  .warn{fill:white;stroke:#C9451A;stroke-width:6;stroke-dasharray:16 9}
</style><rect width="1200" height="720" fill="white"/>
  <text x="50" y="72" class="title" text-anchor="start" style="font-size:40px">Une catégorie = un fluide et un champ d’activité</text><g><rect x="45" y="130" width="260" height="205" rx="18" class="panel"/><text x="69" y="176" class="panel-title" text-anchor="start">A1</text><text x="69" y="218" class="small" text-anchor="start">Fluorés + HC</text></g><text x="69" y="275" class="tiny" text-anchor="start">Toutes activités</text><g><rect x="335" y="130" width="260" height="205" rx="18" class="panel"/><text x="359" y="176" class="panel-title" text-anchor="start">A2</text><text x="359" y="218" class="small" text-anchor="start" style="font-size:29px">Faible charge</text></g><text x="359" y="275" class="tiny" text-anchor="start">Toutes activités</text><g><rect x="625" y="130" width="260" height="205" rx="18" class="panel safe"/><text x="649" y="176" class="panel-title" text-anchor="start">B</text><text x="649" y="218" class="small" text-anchor="start">CO₂ / R-744</text></g><text x="649" y="275" class="tiny" text-anchor="start">Catégorie dédiée</text><g><rect x="915" y="130" width="260" height="205" rx="18" class="panel danger"/><text x="939" y="176" class="panel-title" text-anchor="start">C</text><text x="939" y="218" class="small" text-anchor="start">NH₃ / R-717</text></g><text x="939" y="275" class="tiny" text-anchor="start">Catégorie dédiée</text><g><rect x="45" y="380" width="260" height="205" rx="18" class="panel"/><text x="69" y="426" class="panel-title" text-anchor="start">D</text><text x="69" y="468" class="small" text-anchor="start">Récupérer</text></g><text x="69" y="525" class="tiny" text-anchor="start">Champ limité</text><g><rect x="335" y="380" width="260" height="205" rx="18" class="panel"/><text x="359" y="426" class="panel-title" text-anchor="start">E</text><text x="359" y="468" class="small" text-anchor="start" style="font-size:18px">Contrôle sans ouvrir</text></g><text x="359" y="525" class="tiny" text-anchor="start">Champ limité</text><g><rect x="625" y="380" width="260" height="205" rx="18" class="panel"/><text x="649" y="426" class="panel-title" text-anchor="start">V</text><text x="649" y="468" class="small" text-anchor="start">Véhicules</text></g><text x="649" y="525" class="tiny" text-anchor="start">Champ dédié</text><g><rect x="630" y="640" width="358" height="50" rx="25" class="badge orange"/><text x="648" y="675" class="badge-text" text-anchor="start">A1 / A2 ≠ B / C</text></g>
</svg>