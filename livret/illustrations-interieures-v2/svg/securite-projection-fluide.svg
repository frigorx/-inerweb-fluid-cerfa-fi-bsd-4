  <title id="title">Projection de fluide : sortir de l’axe</title><desc id="desc">Un raccord sous pression projette du fluide dans son axe. Le technicien porte gants et lunettes, vérifie la pression et se place sur le côté avant de desserrer.</desc>
  <metadata><dc:title>Projection de fluide : sortir de l’axe</dc:title><dc:description>Un raccord sous pression projette du fluide dans son axe. Le technicien porte gants et lunettes, vérifie la pression et se place sur le côté avant de desserrer.</dc:description><dc:creator>F. Henninot (direction métier) et OpenAI Codex (dessin SVG original)</dc:creator><dc:source>Création originale inerWeb, pack HabFluide intérieur v2</dc:source><dc:rights>© 2026 Franck Henninot, inerWeb. Tous droits réservés.</dc:rights></metadata>
