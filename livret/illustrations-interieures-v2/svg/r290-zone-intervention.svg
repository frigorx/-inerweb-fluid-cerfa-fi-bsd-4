  <text x="50" y="72" class="title" text-anchor="start" style="font-size:50px">R-290 : préparer la zone avant le geste</text><g><rect x="430" y="250" width="320" height="220" rx="16" class="device"/><circle cx="692" cy="328" r="42" class="thin"/><path d="M 692 292 L 705 328 L 667 315 Z M 692 364 L 680 328 L 718 341 Z" fill="#84B7EC" stroke="#1B3A63" stroke-width="3"/><text x="448" y="452" class="equip" text-anchor="start">MONOBLOC R-290</text></g><g transform="translate(105 280)"><rect x="0" y="20" width="72" height="126" rx="14" class="device"/><rect x="16" y="43" width="40" height="28" rx="4" class="screen"/><path d="M 36 20 C 40 -20, 92 -26, 112 4" class="pipe" fill="none"/><circle cx="114" cy="5" r="8" fill="#C9451A"/><text x="36" y="178" class="small" text-anchor="middle">Détecteur HC</text></g><g transform="translate(940 300)"><circle cx="0" cy="0" r="30" class="person"/><path d="M -36 -6 Q 0 -42 36 -6" class="helmet"/><line x1="-40" y1="-4" x2="40" y2="-4" class="accent"/><path d="M -23 0 H -3 M 3 0 H 23 M -3 0 H 3" class="thin"/><path d="M -45 80 Q 0 38 45 80 V 180 H -45 Z" class="person"/><line x1="-45" y1="88" x2="-90" y2="140" class="person-line"/><line x1="45" y1="88" x2="90" y2="140" class="person-line"/></g><path d="M 385 205 H 795 V 550 H 385 Z" fill="none" stroke="#C0392B" stroke-width="7" stroke-dasharray="22 14"/><text x="590" y="590" class="panel-title" text-anchor="middle">ZONE BALISÉE</text><line x1="430" y1="500" x2="265" y2="500" class="flow" marker-end="url(#arrow)"/><text x="105" y="575" class="small" text-anchor="start">Ventilation active</text><g><path d="M 827 170 H 875 L 897 192 V 240 L 875 262 H 827 L 805 240 V 192 Z" class="stop"/><text x="851" y="228" class="stop-text" text-anchor="middle">FEU</text></g><g><rect x="55" y="125" width="292" height="50" rx="25" class="badge navy"/><text x="73" y="160" class="badge-text" text-anchor="start">PLAQUE + FDS</text></g><g><rect x="405" y="125" width="292" height="50" rx="25" class="badge green"