  <title id="title">Flamme : fluide récupéré avant brasage</title><desc id="desc">La planche oppose le geste interdit, chauffer un circuit contenant du fluide, et le geste sûr : récupérer, inerter à l’azote sec, garder la sortie ouverte puis braser.</desc>
