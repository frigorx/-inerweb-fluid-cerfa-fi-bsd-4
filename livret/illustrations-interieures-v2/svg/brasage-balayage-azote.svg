<svg xmlns="http://www.w3.org/2000/svg" xmlns:dc="http://purl.org/dc/elements/1.1/" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Brasage sous balayage d’azote sec</title><desc id="desc">Avant brasage le fluide est récupéré. Un faible débit d’azote sec traverse le tube, la sortie reste ouverte et la flamme chauffe le joint. Ce balayage n’est pas une épreuve de pression.</desc>
  <metadata><dc:title>Brasage sous balayage d’azote sec</dc:title><dc:description>Avant brasage le fluide est récupéré. Un faible débit d’azote sec traverse le tube, la sortie reste ouverte et la flamme chauffe le joint. Ce balayage n’est pas une épreuve de pression.</dc:description><dc:creator>F. Henninot (direction métier) et OpenAI Codex (dessin SVG original)</dc:creator><dc:source>Création originale inerWeb, pack HabFluide intérieur v2</dc:source><dc:rights>© 2026 Franck Henninot, inerWeb. Tous droits réservés.</dc:rights></metadata>
