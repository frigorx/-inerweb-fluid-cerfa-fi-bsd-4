<svg xmlns="http://www.w3.org/2000/svg" xmlns:dc="http://purl.org/dc/elements/1.1/" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">CO₂ et NH₃ : reconnaître, puis s’arrêter</title><desc id="desc">Deux colonnes distinguent le CO2 R744, catégorie B, haute pression et danger respiratoire, de l’ammoniac R717, catégorie C, toxique et légèrement inflammable. A1 et A2 ne donnent aucune équivalence.</desc>
  <metadata><dc:title>CO₂ et NH₃ : reconnaître, puis s’arrêter</dc:title><dc:description>Deux colonnes distinguent le CO2 R744, catégorie B, haute pression et danger respiratoire, de l’ammoniac R717, catégorie C, toxique et légèrement inflammable. A1 et A2 ne donnent aucune équivalence.</dc:description><dc:creator>F. Henninot (direction métier) et OpenAI Codex (dessin SVG original)</dc:creator><dc:source>Création originale inerWeb, pack HabFluide intérieur v2</dc:source><dc:rights>© 2026 Franck Henninot, inerWeb. Tous droits réservés.</dc:rights></metadata>
