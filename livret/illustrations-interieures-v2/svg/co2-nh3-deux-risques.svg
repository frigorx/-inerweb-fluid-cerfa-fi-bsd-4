  <text x="50" y="72" class="title" text-anchor="start" style="font-size:49px">CO₂ et NH₃ : reconnaître, puis s’arrêter</text><g><rect x="55" y="130" width="510" height="470" rx="18" class="panel safe"/><text x="79" y="176" class="panel-title" text-anchor="start" style="font-size:32px">CO₂ — R-744 — CATÉGORIE B</text><text x="79" y="218" class="small" text-anchor="start" style="font-size:22px">Haute pression + danger respiratoire</text></g><g transform="translate(105 300)"><rect x="18" y="18" width="70" height="164" rx="28" fill="white" stroke="#3D7FCA" stroke-width="6"/><rect x="36" y="0" width="34" height="28" rx="5" fill="white" stroke="#3D7FCA" stroke-width="6"/><line x1="53" y1="0" x2="53" y2="-15" stroke="#3D7FCA" stroke-width="6"/><text x="53" y="105" class="equip" text-anchor="middle">CO₂</text></g><g transform="translate(340 375)"><circle cx="0" cy="0" r="48" class="device"/><path d="M -30 12 A 33 33 0 0 1 30 12" class="thin"/><line x1="0" y1="0" x2="24" y2="-20" class="accent"/><circle cx="0" cy="0" r="6" fill="#1B3A63"/><text x="0" y="78" class="small" text-anchor="middle">Matériel dédié</text></g><text x="105" y="555" class="small" text-anchor="start">Détection / ventilation</text><g><rect x="635" y="130" width="510" height="470" rx="18" class="panel danger"/><text x="659" y="176" class="panel-title" text-anchor="start" style="font-size:32px">NH₃ — R-717 — CATÉGORIE C</text><text x="659" y="218" class="small" text-anchor="start" style="font-size:25px">Toxique + légèrement inflammable</text></g><g transform="translate(685 300)"><rect x="18" y="18" width="70" height="164" rx="28" fill="white" stroke="#C9451A" stroke-width="6"/><rect x="36" y="0" width="34" height="28" rx="5" fill="white" stroke="#C9451A" stroke-width="6"/><line x1="53" y1="0" x2="53" y2="-15" stroke="#C9451A" stroke-width="6"/><text x="53" y="105" class="equip" text-anchor="middle">NH₃</text></g><g transform="translate(900 290)"><rect x="0" y="20" width="72" height="126" rx="14" class="device"/><rect x="16" y="43" width="40" height="28" rx="4" class="screen"/><path d="M 36 20 C 40 -20, 92 -26, 112 4" class="pipe" fill="none"/><circle cx="114" cy="5" r="8" fill="#C9451A"/><text x="36" y="178" class="small" text-anchor="middle">Détection adaptée</text></g><text x="685" y="555" class="small" text-anchor="start">Évacuer selon le site</text><g><rect x="380" y="625" width="644" height="50" rx="25" class="badge orange"/><text x="398" y="660" class="badge-text" text-anchor="start">A1 / A2 : AUCUNE ÉQUIVALENCE</text></g>
