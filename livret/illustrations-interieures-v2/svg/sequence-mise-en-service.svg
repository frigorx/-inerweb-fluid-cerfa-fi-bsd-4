  <title id="title">Avant la première charge : l’ordre est verrouillé</title><desc id="desc">Séquence d’intervention : assemblage contrôlé, épreuve à l’azote sec selon la documentation, contrôle d’étanchéité, tirage au vide avec vacuomètre, tenue du vide puis charge pesée.</desc>
