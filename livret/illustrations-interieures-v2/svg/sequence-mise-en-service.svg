dth="6"/><text x="53" y="105" class="equip" text-anchor="middle">N₂</text></g><g transform="translate(470 560)"><circle cx="0" cy="0" r="48" class="device"/><path d="M -30 12 A 33 33 0 0 1 30 12" class="thin"/><line x1="0" y1="0" x2="24" y2="-20" class="accent"/><circle cx="0" cy="0" r="6" fill="#1B3A63"/><text x="0" y="78" class="small" text-anchor="middle">Vacuomètre</text></g><g><rect x="690" y="470" width="210" height="155" rx="16" class="device"/><circle cx="842" cy="548" r="42" class="thin"/><path d="M 842 512 L 855 548 L 817 535 Z M 842 584 L 830 548 L 868 561 Z" fill="#84B7EC" stroke="#1B3A63" stroke-width="3"/><text x="708" y="607" class="equip" text-anchor="start">CIRCUIT</text></g><g><rect x="930" y="495" width="182" height="50" rx="25" class="badge navy"/><text x="948" y="530" class="badge-text" text-anchor="start">BALANCE</text></g><text x="600" y="690" class="body" text-anchor="middle">Pression, durée, vide et charge : documentation constructeur</text>
