<svg xmlns="http://www.w3.org/2000/svg" xmlns:dc="http://purl.org/dc/elements/1.1/" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Espace clos : mesurer avant d’entrer</title><desc id="desc">Un local en contrebas contient une nappe de gaz. Le technicien reste dehors, ventile, mesure l’atmosphère et alerte. Il ne descend pas secourir sans protection adaptée.</desc>
  <metadata><dc:title>Espace clos : mesurer avant d’entrer</dc:title><dc:description>Un local en contrebas contient une nappe de gaz. Le technicien reste dehors, ventile, mesure l’atmosphère et alerte. Il ne descend pas secourir sans protection adaptée.</dc:description><dc:creator>F. Henninot (direction métier) et OpenAI Codex (dessin SVG original)</dc:creator><dc:source>Création originale inerWeb, pack HabFluide intérieur v2</dc:source><dc:rights>© 2026 Franck Henninot, inerWeb. Tous droits réservés.</dc:rights></metadata>
