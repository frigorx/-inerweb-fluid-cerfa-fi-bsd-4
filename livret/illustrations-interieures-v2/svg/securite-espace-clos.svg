stop"/><text x="1076" y="558" class="stop-text" text-anchor="middle">STOP</text></g><text x="790" y="635" class="body" text-anchor="start">Personne au sol :</text><text x="790" y="680" class="body" text-anchor="start">ne pas descendre</text>
